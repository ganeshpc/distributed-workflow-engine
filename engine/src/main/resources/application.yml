server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/workflow
    username: workflow
    password: workflow
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

workflow:
  recovery:
    enabled: true
    interval-ms: 2000

springdoc:
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
scalar:
  path: /scalar
