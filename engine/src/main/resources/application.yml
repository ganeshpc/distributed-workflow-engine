server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/workflow
    username: workflow
    password: workflow
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: workflow-engine-results
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.workflowengine.api.activity
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health

workflow:
  recovery:
    enabled: true
    interval-ms: 2000
  timeout:
    enabled: true
    interval-ms: 2000
  dispatch:
    tasks-topic: activity.tasks
    results-topic: activity.results
    republish-after-ms: 30000

springdoc:
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
scalar:
  path: /scalar
